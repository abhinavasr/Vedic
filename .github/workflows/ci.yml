name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  analyze-and-test:
    runs-on: macos-latest   # matches the development platform; iOS needs macOS anyway
    steps:
      - uses: actions/checkout@v4

      # The Flutter project is generated by scripts/bootstrap.sh and is not committed
      # until Phase 1 lands. Skip cleanly until then rather than showing a red CI that
      # everyone learns to ignore.
      - id: check
        run: |
          if [ -f pubspec.yaml ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "No pubspec.yaml yet — skipping."; fi

      - if: steps.check.outputs.ready == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - if: steps.check.outputs.ready == 'true'
        run: flutter pub get

      - if: steps.check.outputs.ready == 'true'
        run: dart format --set-exit-if-changed .

      - if: steps.check.outputs.ready == 'true'
        run: flutter analyze

      - if: steps.check.outputs.ready == 'true'
        run: flutter test
