name: vedic
description: "Offline-first scripture reader, panchang and on-device assistant."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  audioplayers: ^6.8.1
  crypto: ^3.0.7
  cryptography: ^2.9.0
  device_info_plus: ^13.2.0
  flutter:
    sdk: flutter
  flutter_gemma: ^1.8.3
  flutter_gemma_litertlm: ^1.6.4
  flutter_tts: ^4.2.5
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.6.0
  wakelock_plus: ^1.8.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  yaml: ^3.1.4
  args: ^2.7.0
  pdfrx_engine: ^0.6.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    # Bundled content packs (docs/CONTENT_PACKS.md). Flat files: a directory
    # entry does not include subdirectories.
    - assets/packs/
    - assets/images/
    - assets/sounds/

# App icons from the Sadhana logo: `dart run flutter_launcher_icons`.
# Sources live in branding/ so they are not bundled into the app.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: branding/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FBF1E1"
  adaptive_icon_foreground: branding/app_icon_foreground.png
  min_sdk_android: 31
