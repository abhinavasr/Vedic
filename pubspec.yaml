name: vedic
description: "Offline-first scripture reader, panchang and on-device assistant."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  crypto: ^3.0.7
  cryptography: ^2.9.0
  flutter:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  yaml: ^3.1.4
  args: ^2.7.0
  pdfrx_engine: ^0.6.0

flutter:
  uses-material-design: true
  assets:
    # Bundled content packs (docs/CONTENT_PACKS.md). Flat files: a directory
    # entry does not include subdirectories.
    - assets/packs/
